#hero.off{opacity:0;visibility:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
.ht{position:absolute;left:5vw;top:6vh;pointer-events:none}
.ht h1{font-size:clamp(38px,7vw,88px);line-height:.95;letter-spacing:.01em;text-shadow:0 0 30px rgba(31,111,178,.8)}
.ht p{font-size:clamp(15px,2vw,24px);color:var(--mut);margin-top:10px;max-width:34ch}
#alert{position:absolute;left:64%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:var(--red);padding:10px 22px;border-radius:40px;font:700 clamp(16px,2.4vw,28px) 'Barlow Condensed';box-shadow:0 0 50px var(--red);white-space:nowrap}
#alert.on{animation:pop 2.4s}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}12%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}85%{opacity:1;transform:translate(-50%,-80%) scale(1)}100%{opacity:0}}
#go{position:absolute;left:5vw;bottom:9vh;border:0;border-radius:50px;padding:16px 34px;font:700 24px 'Barlow Condensed';background:var(--org);color:#1a0f00;cursor:pointer;box-shadow:0 0 0 0 rgba(242,158,76,.7);animation:pl 1.8s infinite}
#go:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
@keyframes pl{70%{box-shadow:0 0 0 22px rgba(242,158,76,0)}100%{box-shadow:0 0 0 0 rgba(242,158,76,0)}}
.shake{animation:sh .5s}@keyframes sh{20%{transform:translate(-7px,5px)}40%{transform:translate(6px,-6px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,4px)}}
#app{position:fixed;inset:0;display:grid;grid-template-columns:340px 1fr}
#map{height:100%;background:#0a1626}
#side{background:var(--card);padding:16px;overflow:auto;border-right:1px solid #1d3a5f;z-index:5}
#side h2{font-size:28px;line-height:1}
.sub{color:var(--mut);font-size:13px;margin:4px 0 12px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kp div{background:#10294d;border-radius:12px;padding:8px;text-align:center}
.kp b{display:block;font:700 30px 'Barlow Condensed'}
.kp span{font-size:12px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
select{width:100%;background:#10294d;color:var(--ink);border:1px solid #24497a;border-radius:10px;padding:8px}
.btn{width:100%;margin-top:10px;border:0;border-radius:10px;padding:10px;font:600 14px Barlow;cursor:pointer;background:var(--blue);color:#fff}
.btn.alt{background:#10294d;border:1px solid #24497a}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:12px 0;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#list .it{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
#list .it:hover{background:#10294d;border-color:#24497a}
#list .em{font-size:22px}#list small{color:var(--mut)}
#route{position:absolute;right:14px;bottom:18px;width:min(380px,calc(100% - 28px));max-height:46vh;overflow:auto;background:var(--card);border:1px solid #24497a;border-radius:16px;padding:14px;z-index:900;display:none}
#route.on{display:block}
#route h3{font-size:24px}.rs{display:flex;gap:14px;margin:6px 0}.rs b{font:700 30px 'Barlow Condensed'}
#route ol{padding-left:18px;font-size:13px;color:var(--mut)}
.modes{display:flex;gap:6px;margin:8px 0}.modes button{flex:1;padding:7px;border-radius:9px;border:1px solid #24497a;background:#10294d;color:var(--ink);cursor:pointer}.modes .a{background:var(--org);color:#1a0f00}
.pin{position:relative;width:44px;height:44px}
.pin .b{position:absolute;inset:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 12px #0008}
.pin .e{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;z-index:2}
.pin .n{position:absolute;right:-6px;top:-6px;z-index:3;background:#fff;color:#000;border-radius:10px;font:700 12px Barlow;padding:0 5px}
.pin.m::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--red);animation:rg 1.5s infinite}
@keyframes rg{from{transform:scale(.6);opacity:1}to{transform:scale(1.7);opacity:0}}
.me{width:20px;height:20px;border-radius:50%;background:#3b9bff;border:3px solid #fff;box-shadow:0 0 0 0 #3b9bff;animation:pl2 1.6s infinite}
@keyframes pl2{70%{box-shadow:0 0 0 22px #3b9bff00}}
.route-anim{stroke-dasharray:12 12;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
.leaflet-routing-container{display:none}
.dark-tiles{filter:invert(1) hue-rotate(195deg) brightness(.92) contrast(.95) saturate(.7)}
.seg{display:flex;background:var(--card);border:1px solid #24497a;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px #0006}.seg button{padding:10px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer;font:600 13px Barlow}.seg .a{background:var(--org);color:#1a0f00}
.coords{background:var(--card);color:var(--ink);padding:5px 10px;border-radius:8px;font:600 12px Barlow;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;border:1px solid #24497a;background:#10294d;color:var(--ink);font:600 13px Barlow;cursor:pointer;transition:background .15s}
.chip small{color:var(--mut);font-size:11px}.chip .dt{width:9px;height:9px;border-radius:50%}
.chip:hover{border-color:var(--org)}.chip.on{background:var(--org);border-color:var(--org);color:#1a0f00}.chip.on small{color:#4a2d00}
input#q{width:100%;background:#10294d;color:var(--ink);border:1px solid #24497a;border-radius:10px;padding:8px}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:2000;background:var(--org);color:#1a0f00;padding:12px 18px;border-radius:14px;font-weight:600;max-width:min(520px,92vw);box-shadow:0 8px 30px #0008;display:none}
.leaflet-popup-content-wrapper{background:#0b1d38;color:var(--ink);border-radius:14px}.leaflet-popup-tip{background:#0b1d38}
.pp h3{font-size:22px}.pp p{font-size:13px;color:var(--mut)}.tag{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;color:#fff;margin-right:4px}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:1fr}#side{position:absolute;left:0;right:0;bottom:0;max-height:38vh;z-index:800;border-top:1px solid #24497a}#route{bottom:40vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

<section id="hero" aria-label="Introducción">
<canvas id="cv"></canvas>
<div class="ht"><h1>ANÁLISIS DE<br>ACCIDENTES VIALES</h1><p>Popayán. Cada punto es un siniestro. Elige uno y te llevamos hasta allí.</p></div>
<div id="alert">⚠ ACCIDENTE DETECTADO</div>
<button id="go">Ver accidentes en el mapa</button>
</section>

<main id="app">
<aside id="side">
<h2>Accidentalidad Popayán</h2>
<p class="sub" id="src">Datos de demostración. Carga tu exportación de Power BI abajo.</p>
<div class="kp"><div><b id="kA">0</b><span>Accidentes</span></div><div><b id="kM" style="color:#ff7b86">0</b><span>Muertos</span></div><div><b id="kH" style="color:var(--org)">0</b><span>Heridos</span></div></div>
<label id="lG">Gravedad · elige las que quieras</label><div class="chips" id="fG" role="group" aria-labelledby="lG"></div>
<label id="lV">Vehículo</label><div class="chips" id="fV" role="group" aria-labelledby="lV"></div>
<label id="lA">Año</label><div class="chips" id="fA" role="group" aria-labelledby="lA"></div>
<label for="q">Buscar</label><input id="q" placeholder="Calle, carrera, sector o vehículo" autocomplete="off">
<div class="leg"><span><i style="background:var(--red)"></i>Con muertos</span><span><i style="background:var(--org)"></i>Con heridos</span><span><i style="background:var(--teal)"></i>Solo daños</span></div>
<button class="btn alt" id="clr">✕ Quitar todos los filtros</button>
<button class="btn" id="near">📍 Ir al accidente más cercano</button>
<button class="btn alt" id="man">🖱️ Marcar mi ubicación en el mapa</button>
<button class="btn alt" id="imp">Cargar CSV / JSON de Power BI</button>
<input type="file" id="file" accept=".csv,.json" hidden>
<h3 style="margin:14px 0 4px;font-size:20px">Accidentes</h3><div id="list"></div>
</aside>
<div id="map"></div>
<div id="toast" role="status"></div>
<section id="route" aria-live="polite"></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>
<script>
/* ===== INTRO: camión, taxi, automóvil y moto chocan en el cruce ===== */
const hero=document.getElementById('hero'),cv=document.getElementById('cv'),cx=cv.getContext('2d');
const IW=1408,IH=768,C=[780,470],T=2.7;
const LANES=[{k:'camion',n:'CAMIÓN',a:[1250,640],d:0},{k:'taxi',n:'TAXI',a:[1180,235],d:.1},{k:'auto',n:'AUTOMÓVIL',a:[470,650],d:.2},{k:'moto',n:'MOTO',a:[610,380],d:.3}];
let W,H,S,ox,oy,sc,t0=performance.now(),fx=[],crashed=false,cars=[],fr=0;
function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;S=Math.max(W/IW,H/IH);ox=(W-IW*S)/2;oy=(H-IH*S)/2;sc=Math.max(1.25,S*1.5)}
addEventListener('resize',fit);fit();
const P=(x,y)=>[ox+x*S,oy+y*S];
function reset(){crashed=false;t0=performance.now();fx=[];cars=LANES.map(l=>({...l,ang:Math.atan2(C[1]-l.a[1],C[0]-l.a[0]),v:[0,0],sp:0}))}
reset();
function boom(){const[x,y]=P(...C);crashed=true;
 cars.forEach(c=>{const m=(c.k=='moto'?1.7:c.k=='camion'?.6:1)*(35+Math.random()*30)*S;c.v=[-Math.cos(c.ang)*m+(Math.random()-.5)*50*S,-Math.sin(c.ang)*m+(Math.random()-.5)*50*S];c.sp=(Math.random()<.5?-1:1)*(1+Math.random()*1.6)});
 hero.classList.remove('shake');void hero.offsetWidth;hero.classList.add('shake');
 const al=document.getElementById('alert');al.classList.remove('on');void al.offsetWidth;al.classList.add('on');
 for(let i=0;i<80;i++){const a=Math.random()*6.28,v=1+Math.random()*8;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:['#ffd27a','#ff7b3a','#fff','#d64550'][i%4]})}
 fx.push({x,y,r:0,ring:1},{x,y,r:0,ring:1,dl:8})}
function rr(x,y,w,h,r,f){cx.fillStyle=f;cx.beginPath();cx.roundRect(x,y,w,h,r);cx.fill()}
function veh(k,x,y,ang,z){cx.save();cx.translate(x,y);cx.rotate(ang);cx.scale(z,z);cx.shadowColor='rgba(0,0,0,.7)';cx.shadowBlur=10;
 if(k=='auto'||k=='taxi'){const taxi=k=='taxi';rr(-20,-9,40,18,5,taxi?'#ffc61a':'#2f7de1');cx.shadowBlur=0;
  rr(3,-7,9,14,2,'#0b1220');rr(-14,-7,6,14,2,'#0b1220');rr(-7,-7,10,14,2,taxi?'#ffe27a':'#5aa3ff');
  if(taxi){rr(-9,-9,18,2,0,'#111');rr(-9,7,18,2,0,'#111');rr(-5,-3,8,6,1,'#fff')}
  rr(18,-7,3,4,1,'#fff');rr(18,3,3,4,1,'#fff');rr(-21,-7,2,4,1,'#f33');rr(-21,3,2,4,1,'#f33')}
 else if(k=='camion'){rr(-38,-10,48,20,2,'#e9eef5');cx.shadowBlur=0;rr(-34,-8,40,1.5,0,'#b8c4d2');rr(-34,6.5,40,1.5,0,'#b8c4d2');rr(12,-9,19,18,4,'#d64550');rr(23,-7,6,14,1,'#0b1220');rr(30,-7,2,4,1,'#fff');rr(30,3,2,4,1,'#fff')}
 else{rr(-11,-1.5,22,3,1.5,'#111');cx.shadowBlur=0;rr(-6,-3,11,6,3,'#d64550');cx.fillStyle='#ffb04a';cx.beginPath();cx.ellipse(-1,0,5,4,0,0,6.28);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(3,0,3,0,6.28);cx.fill();cx.shadowColor='#fff';cx.shadowBlur=12;rr(11,-1.5,3,3,1,'#fff')}
 cx.restore()}
function loop(now){if(hero.classList.contains('off'))return;fr++;
 cx.clearRect(0,0,W,H);const t=(now-t0)/1000,[X,Y]=P(...C);
 if(t>=T&&!crashed)boom();
 cars.forEach(c=>{let x,y,ang=c.ang;
  if(t<T){const k=Math.min(1,Math.max(0,(t-c.d)/(T-c.d))),e=Math.pow(k,1.7);[x,y]=P(c.a[0]+(C[0]-c.a[0])*e,c.a[1]+(C[1]-c.a[1])*e);
   if(k>.15&&k<.95){cx.font="700 "+Math.round(13*Math.max(1,S))+"px 'Barlow Condensed',sans-serif";cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='#000a';cx.fillStyle='#fff';cx.strokeText(c.n,x,y-26*sc);cx.fillText(c.n,x,y-26*sc)}}
  else{const q=1-Math.exp(-4*(t-T));x=X+c.v[0]*q;y=Y+c.v[1]*q;ang=c.ang+c.sp*q}
  veh(c.k,x,y,ang,c.k=='moto'?sc*1.35:sc)});
 if(crashed){if(fr%3==0&&t<T+3.6)fx.push({sm:1,x:X+(Math.random()-.5)*50*S,y:Y+(Math.random()-.5)*20*S,vx:(Math.random()-.5)*.6,r:6,l:1});
  const g=cx.createRadialGradient(X,Y,0,X,Y,120*S);g.addColorStop(0,`rgba(255,200,100,${Math.max(0,.9-(t-T)*1.4)})`);g.addColorStop(1,'transparent');cx.fillStyle=g;cx.fillRect(0,0,W,H)}
 fx=fx.filter(p=>{if(p.sm){p.x+=p.vx;p.y-=.6;p.r+=.3;p.l-=.009;cx.fillStyle=`rgba(190,200,210,${Math.max(0,p.l*.28)})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill();return p.l>0}
  if(p.ring){p.dl=(p.dl||0)-1;if(p.dl>0)return true;p.r+=6;cx.strokeStyle=`rgba(255,160,80,${Math.max(0,1-p.r/260)})`;cx.lineWidth=4;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.stroke();return p.r<260}
  p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.018;cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,p.l);cx.fillRect(p.x,p.y,3,3);cx.globalAlpha=1;return p.l>0});
 if(crashed&&t>T+.1){const f=Math.floor(t*6)%2;cx.fillStyle=f?'rgba(214,69,80,.9)':'rgba(60,140,255,.9)';cx.beginPath();cx.arc(X,Y-14*S,6,0,6.28);cx.fill()}
 if(t>T+4.8)reset();
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
document.getElementById('go').onclick=()=>{hero.classList.add('off');setTimeout(()=>{try{map.invalidateSize()}catch(e){}},100)};

/* ===== DATOS (esquema del dashboard: Radicado, Tipo_Accidente, Sector, Comuna, Gravedad, Hora, Anio, Muertos, Heridos, Nro_Vehiculos, Coordenada_Estimada) ===== */
const VEH={Moto:'🏍️',Carro:'🚗',Taxi:'🚕',Bus:'🚌',Camión:'🚛',Bicicleta:'🚲',Peatón:'🚶'};
function demo(){let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 const SEC=[['Centro histórico',2.4419,-76.6063,1],['Pomona',2.4575,-76.6000,4],['Bolívar',2.4560,-76.6180,5],['Campo Bello',2.4630,-76.6130,6],['Modelo',2.4480,-76.5920,3],['La Esmeralda',2.4350,-76.6120,2],['Los Hoyos',2.4290,-76.6200,8],['Yanaconas',2.4680,-76.5990,4],['Tomás Cipriano',2.4400,-76.5800,9]];
 const TA=['Choque','Atropello','Volcamiento','Caída de ocupante','Choque con objeto fijo'],VK=Object.keys(VEH),D=[];
 for(let i=0;i<46;i++){const z=SEC[i%SEC.length],v=VK[Math.floor(r()*r()*VK.length)],g=r(),mu=g>.88?1:0,he=mu?1+Math.floor(r()*2):(g>.4?1+Math.floor(r()*3):0);
  D.push({Radicado:'POP-'+(1000+i),Direccion:(r()>.5?'Cl ':'Cra ')+(1+Math.floor(r()*30))+' # '+(1+Math.floor(r()*25))+'-'+(1+Math.floor(r()*90)),lat:z[1]+(r()-.5)*.016,lng:z[2]+(r()-.5)*.016,Vehiculo:v,Tipo_Accidente:v=='Peatón'?'Atropello':TA[Math.floor(r()*5)],Sector:z[0],Comuna:'Comuna '+z[3],Gravedad:mu?'Con muertos':he?'Con heridos':'Solo daños',Muertos:mu,Heridos:he,Nro_Vehiculos:1+Math.floor(r()*3),Anio:2022+Math.floor(r()*4),Hora:Math.floor(r()*24)+':00',Coordenada_Estimada:r()>.8?'Sí':'No'})}
 return D}
let DATA=demo();
const col=a=>a.Muertos>0?'#D64550':a.Heridos>0?'#F29E4C':'#17A398';
const $=id=>document.getElementById(id);

/* ===== MAPA ===== */
if(typeof L==='undefined'){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:auto 16px 16px;z-index:999;background:#D64550;color:#fff;padding:14px;border-radius:12px">No se pudo cargar el mapa (Leaflet). Abre este archivo directamente en tu navegador con internet, no en una vista previa restringida.</div>');throw new Error('Leaflet no cargó')}
const map=L.map('map',{zoomControl:false}).setView([2.4448,-76.6147],14);
L.control.zoom({position:'topright'}).addTo(map);
const OSM='https://tile.openstreetmap.org/{z}/{x}/{y}.png',ES='https://server.arcgisonline.com/ArcGIS/rest/services/',O={maxNativeZoom:19,maxZoom:20};
const STR=ES+'World_Street_Map/MapServer/tile/{z}/{y}/{x}',AT='Mapa © Esri, HERE, Garmin, OpenStreetMap contributors';
const BASE={calles:L.layerGroup([L.tileLayer(STR,{...O,attribution:AT})]),
 sat:L.layerGroup([L.tileLayer(ES+'World_Imagery/MapServer/tile/{z}/{y}/{x}',{...O,attribution:'Imágenes © Esri, Maxar, Earthstar Geographics'}),L.tileLayer(ES+'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',O),L.tileLayer(ES+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',O)]),
 noche:L.layerGroup([L.tileLayer(STR,{...O,className:'dark-tiles',attribution:AT})])};
let cur=null;
function setBase(k){cur&&map.removeLayer(cur);cur=BASE[k];cur.addTo(map);document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('a',b.dataset.k==k))}
new (L.Control.extend({onAdd(){const d=L.DomUtil.create('div','seg');d.innerHTML='<button data-k="calles">🗺️ Calles</button><button data-k="sat">🛰️ Satélite</button><button data-k="noche">🌙 Nocturno</button>';L.DomEvent.disableClickPropagation(d);d.onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;k&&setBase(k)};return d}}))({position:'topleft'}).addTo(map);
setBase('calles');
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
new (L.Control.extend({onAdd(){const d=L.DomUtil.create('div','coords');d.textContent='LAT 2.44190  LON -76.60630';map.on('mousemove',e=>d.textContent='LAT '+e.latlng.lat.toFixed(5)+'  LON '+e.latlng.lng.toFixed(5));return d}}))({position:'bottomleft'}).addTo(map);
let layer=L.layerGroup().addTo(map),markers={},me=null,meMark=null,ctl=null,mode='routed-car',target=null;
function pin(a){const mu=a.Muertos>0;return L.divIcon({className:'',iconSize:[44,44],iconAnchor:[22,44],popupAnchor:[0,-40],html:`<div class="pin ${mu?'m':''}"><div class="b" style="background:${col(a)}"></div><div class="e">${VEH[a.Vehiculo]||'🚗'}</div><div class="n">${a.Muertos+a.Heridos||'·'}</div></div>`})}
const sel={fG:new Set(),fV:new Set(),fA:new Set()},GC={'Con muertos':'#D64550','Con heridos':'#F29E4C','Solo daños':'#17A398'};
function chips(id,vals,fmt){const el=$(id),S=sel[id],cnt={};S.clear();vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);el.innerHTML='';
 Object.keys(cnt).sort().forEach(v=>{const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed','false');b.innerHTML=fmt(v)+' <small>'+cnt[v]+'</small>';
  b.onclick=()=>{S.has(v)?S.delete(v):S.add(v);b.classList.toggle('on',S.has(v));b.setAttribute('aria-pressed',S.has(v));render()};el.appendChild(b)})}
function setup(){chips('fG',DATA.map(d=>d.Gravedad),v=>`<i class="dt" style="background:${GC[v]||'#888'}"></i>${v}`);chips('fV',DATA.map(d=>d.Vehiculo),v=>(VEH[v]||'')+' '+v);chips('fA',DATA.map(d=>d.Anio),v=>v);render()}
function render(){const g=sel.fG,v=sel.fV,y=sel.fA;
 const q=($('q').value||'').toLowerCase().trim();
 const F=DATA.filter(a=>(!g.size||g.has(a.Gravedad))&&(!v.size||v.has(a.Vehiculo))&&(!y.size||y.has(String(a.Anio)))&&(!q||[a.Direccion,a.Sector,a.Comuna,a.Tipo_Accidente,a.Vehiculo].join(' ').toLowerCase().includes(q)));
 layer.clearLayers();markers={};$('list').innerHTML='';
 F.forEach(a=>{if(a.Coordenada_Estimada=='Sí')L.circle([a.lat,a.lng],{radius:140,color:'#F29E4C',weight:1.5,dashArray:'5 5',fillOpacity:.14}).addTo(layer);const m=L.marker([a.lat,a.lng],{icon:pin(a)}).addTo(layer);markers[a.Radicado]=m;
  m.bindPopup(`<div class="pp"><h3>${VEH[a.Vehiculo]||''} ${a.Tipo_Accidente}</h3><p><b>${a.Direccion||''}</b><br>${a.Sector} · ${a.Comuna} · ${a.Hora} · ${a.Anio}</p>
  <p><span class="tag" style="background:${col(a)}">${a.Gravedad}</span>☠ ${a.Muertos} · 🩹 ${a.Heridos} · 🚘 ${a.Nro_Vehiculos}</p>
  ${a.Coordenada_Estimada=='Sí'?'<p>⚠ Ubicación estimada (círculo = margen de error)</p>':''}<button class="btn" onclick="goTo('${a.Radicado}')">Cómo llegar</button></div>`);
  const d=document.createElement('div');d.className='it';d.innerHTML=`<span class="em">${VEH[a.Vehiculo]||'🚗'}</span><div><b>${a.Tipo_Accidente}</b><br><small>${a.Direccion||a.Sector} · ${a.Anio}</small></div>`;
  d.onclick=()=>{map.flyTo([a.lat,a.lng],18,{duration:1.2});setTimeout(()=>m.openPopup(),1250)};$('list').appendChild(d)});
 if(!F.length)$('list').innerHTML='<p class="sub">Ningún accidente coincide. Quita algún filtro.</p>';
 $('kA').textContent=F.length;$('kM').textContent=F.reduce((s,a)=>s+a.Muertos,0);$('kH').textContent=F.reduce((s,a)=>s+a.Heridos,0);
 if(F.length)map.fitBounds(L.latLngBounds(F.map(a=>[a.lat,a.lng])).pad(.15))}
$('q').oninput=render;$('clr').onclick=()=>{Object.values(sel).forEach(s=>s.clear());document.querySelectorAll('.chip.on').forEach(c=>{c.classList.remove('on');c.setAttribute('aria-pressed','false')});$('q').value='';render()};

/* ===== UBICACIÓN Y RUTA ===== */
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>e.style.display='none',ms||7000)}
function pickStart(cb,why){toast((why||'')+' Toca en el mapa el punto donde estás y trazo la ruta desde ahí.',9000);map.getContainer().style.cursor='crosshair';
 map.once('click',e=>{me=e.latlng;mark();map.getContainer().style.cursor='';$('toast').style.display='none';cb()})}
function locate(cb){const ok=p=>{me=L.latLng(p.coords.latitude,p.coords.longitude);mark();cb()},
 bad=er=>{const f=location.protocol==='file:';pickStart(cb,f?'Chrome bloquea la ubicación en archivos abiertos desde el disco (file://). Abre la página con localhost o súbela a internet para usar el GPS.':er&&er.code==1?'El permiso de ubicación está bloqueado en este sitio.':'No pude obtener tu ubicación.')};
 navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,bad,{enableHighAccuracy:true,timeout:9000,maximumAge:30000}):bad()}
function mark(){meMark&&meMark.remove();meMark=L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[20,20]}),zIndexOffset:999}).addTo(map).bindTooltip('Estás aquí')}
window.goTo=id=>{target=DATA.find(a=>a.Radicado==id);map.closePopup();me?draw():locate(draw)};
function draw(){if(!target)return;ctl&&map.removeControl(ctl);
 ctl=L.Routing.control({waypoints:[me,L.latLng(target.lat,target.lng)],router:L.Routing.osrmv1({serviceUrl:'https://routing.openstreetmap.de/'+mode+'/route/v1',profile:'driving',language:'es'}),
  addWaypoints:false,draggableWaypoints:false,fitSelectedRoutes:true,createMarker:()=>null,lineOptions:{styles:[{color:'#000',weight:11,opacity:.35},{color:'#F29E4C',weight:6,className:'route-anim'}]}}).addTo(map);
 ctl.on('routesfound',e=>{const r=e.routes[0],km=(r.summary.totalDistance/1000).toFixed(1),min=Math.max(1,Math.round(r.summary.totalTime/60));panel(km,min,r.instructions)});
 ctl.on('routingerror',()=>{L.polyline([me,[target.lat,target.lng]],{color:'#F29E4C',weight:5,dashArray:'10 10',className:'route-anim'}).addTo(map);map.fitBounds([me,[target.lat,target.lng]],{padding:[80,80]});panel((me.distanceTo([target.lat,target.lng])/1000).toFixed(1),'—',[],true)})}
function panel(km,min,ins,fail){const R=$('route');R.className='on';
 R.innerHTML=`<h3>${VEH[target.Vehiculo]||''} ${target.Tipo_Accidente} · ${target.Sector}</h3>
 <div class="modes">${[['routed-car','🚗 Auto'],['routed-bike','🚲 Bici'],['routed-foot','🚶 A pie']].map(m=>`<button class="${m[0]==mode?'a':''}" onclick="mode='${m[0]}';draw()">${m[1]}</button>`).join('')}</div>
 <div class="rs"><div><b>${km} km</b><br><small>distancia</small></div><div><b>${min} min</b><br><small>tiempo</small></div></div>
 ${fail?'<p style="color:var(--mut);font-size:13px">Sin servicio de rutas. Se muestra la línea recta.</p>':`<ol>${ins.slice(0,12).map(i=>`<li>${i.text}</li>`).join('')}</ol>`}
 <button class="btn alt" onclick="clr()">Cerrar ruta</button>`}
window.clr=()=>{ctl&&map.removeControl(ctl);ctl=null;$('route').className=''};
$('near').onclick=()=>locate(()=>{const F=Object.keys(markers).map(id=>DATA.find(a=>a.Radicado==id));if(!F.length)return;
 target=F.sort((a,b)=>me.distanceTo([a.lat,a.lng])-me.distanceTo([b.lat,b.lng]))[0];draw()});

/* ===== IMPORTAR EXPORT DE POWER BI ===== */
$('man').onclick=()=>pickStart(()=>{target&&draw()},'');
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();let rows;
 try{rows=f.name.endsWith('.json')?JSON.parse(t):csv(t)}catch(x){return alert('No pude leer el archivo.')}
 const pick=(o,ks)=>{for(const k of Object.keys(o))if(ks.includes(k.toLowerCase().replace(/[^a-z_]/g,'')))return o[k]};
 const out=rows.map((o,i)=>{const lat=parseFloat(String(pick(o,['latitud','lat','latitude'])).replace(',','.')),lng=parseFloat(String(pick(o,['longitud','lng','lon','longitude'])).replace(',','.'));
  return{Radicado:String(pick(o,['radicado'])||'R'+i),Direccion:pick(o,['direccion','address'])||'',lat,lng,Vehiculo:pick(o,['vehiculo','tipo_vehiculo','clase_vehiculo','clasevehiculo'])||'Carro',Tipo_Accidente:pick(o,['tipo_accidente'])||'Accidente',Sector:pick(o,['sector'])||'',Comuna:pick(o,['comuna'])||'',
  Muertos:+pick(o,['muertos'])||0,Heridos:+pick(o,['heridos'])||0,Nro_Vehiculos:+pick(o,['nro_vehiculos'])||1,Anio:pick(o,['anio','ao','año'])||'',Hora:pick(o,['hora'])||'',Coordenada_Estimada:pick(o,['coordenada_estimada'])||'No',
  Gravedad:pick(o,['gravedad'])||(+pick(o,['muertos'])>0?'Con muertos':+pick(o,['heridos'])>0?'Con heridos':'Solo daños')}}).filter(a=>isFinite(a.lat)&&isFinite(a.lng));
 if(!out.length)return alert('El archivo necesita columnas de Latitud y Longitud.');
 DATA=out;$('src').textContent=f.name+' · '+out.length+' accidentes';setup()};
function csv(t){const L=t.trim().split(/\r?\n/),sp=L[0].includes(';')?';':',',h=L[0].split(sp).map(s=>s.replace(/^"|"$/g,'').trim());
 return L.slice(1).map(l=>{const c=l.split(sp);return Object.fromEntries(h.map((k,i)=>[k,(c[i]||'').replace(/^"|"$/g,'')]))})}
setup();
